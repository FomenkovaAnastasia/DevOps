services:
  backend:
    build:
      context: ./backend
    image: FomenkovaAnastasia/backend:2.0
    container_name: backend_app
    restart: always
    volumes:
      - ./backend/data.txt:/app/data.txt
    networks:
      - devops-network

  frontend:
    build:
      context: ./frontend
    image: FomenkovaAnastasia/frontend:2.0
    container_name: frontend_app
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - devops-network

networks:
  devops-network:
    driver: bridge