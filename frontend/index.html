<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Frontend v2.0</title>
</head>
<body>
    <h1>Версия 2.0</h1>
    <div>
        <input type="text" id="textInput" placeholder="Введите текст">
        <button onclick="sendData()">Отправить</button>
    </div>
    <hr>
    <div>
        <button onclick="readData()">Показать данные с сервера</button>
        <br><br>
        <textarea id="outputArea" rows="10" cols="50" placeholder="Результат запроса..."></textarea>
    </div>
    <script>
        async function sendData() {
            const text = document.getElementById('textInput').value;
            // ИЗМЕНЕНО: используем относительный путь /api/save
            await fetch('/api/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });
        }
        async function readData() {
            // ИЗМЕНЕНО: используем относительный путь /api/read
            const response = await fetch('/api/read');
            const result = await response.json();
            document.getElementById('outputArea').value = result.content;
        }
    </script>
</body>
</html>
